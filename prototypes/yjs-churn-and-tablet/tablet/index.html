<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE: Yjs board benchmark</title>
<style>
 body{font:15px/1.4 -apple-system,system-ui,sans-serif;margin:12px;max-width:1000px}
 button{font-size:16px;padding:10px 14px;margin:3px;border:1px solid #444;border-radius:6px;background:#eee}
 button.on{background:#222;color:#fff} button:disabled{opacity:.4}
 table{border-collapse:collapse;font-size:13px;margin:8px 0} td,th{border:1px solid #bbb;padding:3px 6px;text-align:right} th{background:#eee}
 textarea{width:100%;height:180px;font:11px monospace} #log{white-space:pre-wrap;font:12px monospace;background:#f4f4f4;padding:6px;height:120px;overflow:auto}
 canvas{border:1px solid #888;width:200px;height:300px} .warn{background:#fff3cd;padding:6px;border-radius:4px}
</style></head><body>
<h2>PROTOTYPE (throwaway): Yjs board benchmark</h2>
<div class="warn">Keep this tab in the foreground and the screen awake while it runs. Wi-Fi only (turn off any VPN). <span id="memnote"></span></div>
<div>Board size: <span id="sizes"></span></div>
<div>Layout: <span id="layouts"></span></div>
<div>
 <button id="seed">1. Seed on server</button>
 <button id="run">2. Run measurements</button>
 <button id="all">Run ALL (8 combos, seeds as needed)</button>
 <button id="clear">Clear results</button>
</div>
<div id="log"></div>
<canvas id="cv" width="800" height="1200"></canvas>
<h3>Results</h3>
<div id="tbl"></div>
<button id="copy">Copy results as JSON</button> <span id="copystatus"></span>
<p>If the copy button does not work (plain-http clipboard is blocked on iPad Safari), tap in the box, Select All, Copy:</p>
<textarea id="json" readonly></textarea>
<script src="/client.js"></script>
</body></html>
